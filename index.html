```
<h1><b>WHO WILL WIN THIS FIGHT?</b></h1>

<p>Choose your fighter and opponent!</p>


<div class="fight-selection">

    <!-- YOUR FIGHTER -->
    <div class="fighter-selection">

        <h2>YOUR FIGHTER</h2>

        <select id="fighter">
            <option value="">-- Choose Fighter --</option>
            <option value="deadpool">Deadpool</option>
            <option value="goku">Goku</option>
            <option value="macho-man">Macho Man Randy Savage</option>
            <option value="kool-aid-man">Kool-Aid Man</option>
            <option value="metal-sonic">Metal Sonic</option>
            <option value="po">Po</option>
        </select>

        <br><br>

        <img id="fighterImage"
             src="images/question-mark.jpg"
             alt="Your fighter">

    </div>


    <!-- VS -->
    <div class="vs">
        <h2>VS</h2>
    </div>


    <!-- OPPONENT -->
    <div class="fighter-selection">

        <h2>OPPONENT</h2>

        <select id="opponent">
            <option value="">-- Choose Opponent --</option>
            <option value="deadpool">Deadpool</option>
            <option value="goku">Goku</option>
            <option value="macho-man">Macho Man Randy Savage</option>
            <option value="kool-aid-man">Kool-Aid Man</option>
            <option value="metal-sonic">Metal Sonic</option>
            <option value="po">Po</option>
        </select>

        <br><br>

        <img id="opponentImage"
             src="images/question-mark.jpg"
             alt="Opponent">

    </div>

</div>


<br>

<button id="startFight">START FIGHT!</button>


<div id="result">

    <h2>FIGHT RESULT</h2>

    <p id="winner">Choose two fighters to begin.</p>

    <div id="stats">
        <!-- Fighter stats will appear here -->
    </div>

</div>


<script src="script.js"></script>
```
